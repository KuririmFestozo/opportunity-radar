name: Daily Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # 07:00 BRT

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          GUPY_TOKEN: ${{ secrets.GUPY_TOKEN }}
          ACTIVE_PROFILES: electrical_internship_br,computer_science_internship_br
        run: python main.py
      - name: Commit output
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "opportunity-radar-bot@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: update opportunity radar"
          git push

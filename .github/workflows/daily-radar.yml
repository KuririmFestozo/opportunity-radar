name: Daily Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # 07:00 BRT

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run radar
        env:
          GUPY_TOKEN: ${{ secrets.GUPY_TOKEN }}
          ACTIVE_PROFILES: electrical_internship_br,computer_science_internship_br
        run: python main.py

      - name: Upload generated dashboard
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-output
          path: output/
          retention-days: 7

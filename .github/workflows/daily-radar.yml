name: Daily Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # 07:00 BRT

concurrency:
  group: opportunity-radar-state-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Restore incremental database
        uses: actions/cache/restore@v4
        with:
          path: data/opportunity_radar.db
          key: opportunity-radar-db-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            opportunity-radar-db-${{ runner.os }}-${{ github.ref_name }}-
            opportunity-radar-db-${{ runner.os }}-main-

      - name: Run daily full audit
        env:
          GUPY_TOKEN: ${{ secrets.GUPY_TOKEN }}
          ACTIVE_PROFILES: electrical_internship_br,computer_science_internship_br,chemical_engineering_internship_br,ufscar_engineering_internship_br
          DAILY_AUDIT: "1"
          UNBOUNDED_COLLECTION: "1"
          REQUEST_CONNECT_TIMEOUT: "8"
          REQUEST_READ_TIMEOUT: "20"
          REQUEST_TOTAL_TIMEOUT: "45"
          REQUEST_RETRIES: "3"
          RETRY_BACKOFF_SECONDS: "1.2"
        run: python -u main.py

      - name: Checkpoint SQLite WAL
        if: success()
        run: python -c "import sqlite3; c=sqlite3.connect('data/opportunity_radar.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"

      - name: Save incremental database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/opportunity_radar.db
          key: opportunity-radar-db-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload incremental database snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-state
          path: data/opportunity_radar.db
          retention-days: 7

      - name: Prepare rolling server state
        if: success()
        shell: bash
        run: |
          STATE_CHANNEL="${GITHUB_REF_NAME//\//-}"
          echo "STATE_CHANNEL=$STATE_CHANNEL" >> "$GITHUB_ENV"
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import zipfile
          from datetime import datetime, timezone

          db = pathlib.Path("data/opportunity_radar.db")
          channel = os.environ["GITHUB_REF_NAME"].replace("/", "-")
          compressed = pathlib.Path(f"opportunity_radar-{channel}.db.gz")
          metadata = pathlib.Path(f"opportunity_radar-{channel}.state.json")
          output_zip = pathlib.Path(f"opportunity_radar-{channel}-output.zip")

          with db.open("rb") as source, gzip.open(compressed, "wb") as target:
              shutil.copyfileobj(source, target)

          output_dir = pathlib.Path("output")
          with zipfile.ZipFile(
              output_zip, "w", compression=zipfile.ZIP_DEFLATED
          ) as archive:
              for path in sorted(output_dir.rglob("*")):
                  if path.is_file():
                      archive.write(
                          path,
                          path.relative_to(output_dir).as_posix(),
                      )

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          metadata.write_text(
              json.dumps(
                  {
                      "channel": channel,
                      "commit_sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "generated_at": datetime.now(timezone.utc).isoformat(),
                      "db_bytes": db.stat().st_size,
                      "db_sha256": sha256(db),
                      "gzip_sha256": sha256(compressed),
                      "output_zip_sha256": sha256(output_zip),
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish rolling server state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="radar-state-latest"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "Opportunity Radar rolling state snapshots"               --notes "Rolling, branch-scoped SQLite snapshots for server bootstrap. Data version is recorded in each .state.json asset."
          fi
          gh release upload "$TAG"             "opportunity_radar-${STATE_CHANNEL}.db.gz"             "opportunity_radar-${STATE_CHANNEL}.state.json"             --repo "$GITHUB_REPOSITORY"             --clobber
          "opportunity_radar-${STATE_CHANNEL}-output.zip" \

      - name: Upload generated dashboard
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-output
          path: output/
          retention-days: 7

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Run structural regressions
        run: python check_project.py

      - name: Validate CP4 migration on clean SQLite
        run: python -m tools.migrate_unified_schema --db /tmp/opportunity-radar-ci.db

# Demonstration only. Credentials are local and are NOT suitable for production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opportunity_radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_demo_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
      - ./web-mvc/src/main/resources/db/catalog-schema.sql:/docker-entrypoint-initdb.d/01-catalog.sql:ro
      - ./web-mvc/src/main/resources/db/web-schema.sql:/docker-entrypoint-initdb.d/02-web.sql:ro
      - ./web-mvc/src/main/resources/db/seed-demo.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d opportunity_radar"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web-mvc
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/opportunity_radar
      SPRING_DATASOURCE_USERNAME: radar
      SPRING_DATASOURCE_PASSWORD: radar_demo_local_only
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  radar_pgdata:

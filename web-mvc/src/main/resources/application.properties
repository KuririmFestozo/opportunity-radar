spring.application.name=opportunity-radar-web
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080
# Local defaults are for Docker PostgreSQL on 127.0.0.1:5433.
# Override these variables when deploying; NEVER use demo credentials publicly.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/opportunity_radar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:radar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:radar_demo_local_only}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/catalog-schema.sql,classpath:db/web-schema.sql
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=true

# Reconstruct public HTTPS origin behind Cloudflare Tunnel for cookies and links.
server.forward-headers-strategy=framework

# Sessions are server-side; the browser stores only a session identifier.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

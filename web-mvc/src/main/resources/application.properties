spring.application.name=opportunity-radar-web
server.address=127.0.0.1
server.port=8080
radar.db.path=${RADAR_DB_PATH:../data/opportunity_radar.db}
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/web-schema.sql
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

# Reconstruct public HTTPS origin behind Cloudflare Tunnel for cookies and links.
server.forward-headers-strategy=framework

# Sessions are server-side; the browser stores only a session identifier.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h
